# Test ortamı için izole yerel PostgreSQL Docker container bağlantısı
# Production / Supabase veritabanına asla bağlanılmaz.
spring.datasource.url=jdbc:postgresql://localhost:5433/testdb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=-1

# Flyway test ortamında sıfırdan tabloları kursun
spring.flyway.enabled=true
